<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TASKS — Do The Thing</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
</head>
<body>

  <div class="noise"></div>

  <header>
    <div class="header-inner">
      <div class="logo">TASKS</div>
      <div class="tagline">do the thing.</div>
      <div class="stats">
        <span id="stat-done">0</span> done /
        <span id="stat-left">0</span> left
      </div>
    </div>
  </header>

  <main>

    <section class="input-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="task-input"
          placeholder="add a task..."
          maxlength="120"
          autocomplete="off"
        />
        <button id="add-btn" aria-label="Add task">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <line x1="11" y1="2" x2="11" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="2" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="active">ACTIVE</button>
      <button class="filter-btn" data-filter="done">DONE</button>
    </section>

    <section class="task-list-section">
      <ul id="task-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <span class="empty-icon">◎</span>
        <p>nothing here yet.</p>
      </div>
    </section>

    <footer class="list-footer">
      <button id="clear-done-btn">clear completed</button>
    </footer>

  </main>

  <!-- Reminder Modal -->
  <div id="reminder-overlay" class="reminder-overlay hidden" role="dialog" aria-modal="true" aria-label="Set reminder">
    <div class="reminder-modal">
      <div class="reminder-header">
        <span class="reminder-title">SET REMINDER</span>
        <button id="reminder-close" aria-label="Close">&times;</button>
      </div>
      <p id="reminder-task-label" class="reminder-task-label"></p>
      <div class="reminder-body">
        <input type="datetime-local" id="reminder-datetime" />
        <div class="reminder-quick">
          <span class="quick-label">quick:</span>
          <button class="quick-btn" data-mins="15">+15m</button>
          <button class="quick-btn" data-mins="60">+1h</button>
          <button class="quick-btn" data-mins="480">+8h</button>
          <button class="quick-btn" data-mins="1440">+1d</button>
        </div>
      </div>
      <div class="reminder-footer">
        <button id="reminder-clear-btn" class="reminder-clear">remove reminder</button>
        <button id="reminder-save-btn" class="reminder-save">SET REMINDER</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
